<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#0f2027;#1e3c72;#2c5364" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#2a5298;#2c5364;#0f2027" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" fill="url(#bg2)"/>

  <text x="600" y="65" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="20" fill="#e6fffa" letter-spacing="3">
    LET'S BUILD SOMETHING TOGETHER
  </text>

  <g transform="translate(600,100)">
    <circle r="5" fill="#4fd1c5"/>
    <circle r="3" fill="#ffffff" cx="24" cy="0">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#9f7aea" cx="0" cy="24">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="-360 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
