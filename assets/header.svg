<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#2c5364;#1e3c72;#0f2027" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#203a43">
        <animate attributeName="stop-color" values="#203a43;#2a5298;#2c5364;#203a43" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#0f2027;#2a5298;#2c5364" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <g stroke="#4fd1c5" stroke-width="1" opacity="0.22" fill="none">
    <path d="M0,40 H180 L220,80 H420 L460,40 H700"/>
    <path d="M1200,240 H1020 L980,200 H780 L740,240 H520"/>
    <path d="M0,220 H140 L170,190 H320"/>
    <path d="M1200,60 H1060 L1030,90 H900"/>
    <path d="M0,140 H90 L120,110 H260"/>
    <path d="M1200,150 H1110 L1080,180 H960"/>
  </g>

  <circle r="4" fill="#4fd1c5">
    <animateMotion dur="6s" repeatCount="indefinite" path="M0,40 H180 L220,80 H420 L460,40 H700"/>
  </circle>
  <circle r="4" fill="#63b3ed">
    <animateMotion dur="7s" repeatCount="indefinite" path="M1200,240 H1020 L980,200 H780 L740,240 H520"/>
  </circle>
  <circle r="3" fill="#9f7aea">
    <animateMotion dur="5s" repeatCount="indefinite" path="M0,220 H140 L170,190 H320"/>
  </circle>
  <circle r="3" fill="#4fd1c5">
    <animateMotion dur="6.5s" repeatCount="indefinite" path="M1200,60 H1060 L1030,90 H900"/>
  </circle>
  <circle r="2.5" fill="#63b3ed">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M0,140 H90 L120,110 H260"/>
  </circle>
  <circle r="2.5" fill="#9f7aea">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M1200,150 H1110 L1080,180 H960"/>
  </circle>

  <text x="600" y="115" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="50" font-weight="700" fill="#ffffff" filter="url(#glow)" opacity="0">
    PETER HINGA
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <defs>
    <clipPath id="clipA"><rect x="370" y="140" width="0" height="30"><animate attributeName="width" dur="8s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.1875;0.375;0.4375;1" values="0;400;400;0;0"/></rect></clipPath>
    <clipPath id="clipB"><rect x="370" y="140" width="0" height="30"><animate attributeName="width" dur="8s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.4375;0.625;0.8125;0.875;1" values="0;0;450;450;0;0"/></rect></clipPath>
  </defs>

  <g opacity="1">
    <animate attributeName="opacity" dur="8s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.4374;0.4375;1" values="1;1;0;0"/>
    <g clip-path="url(#clipA)">
      <text x="370" y="162" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="18" letter-spacing="2" fill="#9fd9d1" textLength="400" lengthAdjust="spacingAndGlyphs">SOFTWARE DEVELOPER | LEARNER</text>
    </g>
    <rect y="145" width="3" height="20" fill="#4fd1c5">
      <animate attributeName="x" dur="8s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.1875;0.375;0.4375;1" values="370;770;770;370;370"/>
      <animate attributeName="opacity" dur="0.8s" begin="1.2s" repeatCount="indefinite" values="1;1;0;0"/>
    </rect>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" dur="8s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.4374;0.4375;1" values="0;0;1;1"/>
    <g clip-path="url(#clipB)">
      <text x="370" y="162" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="18" letter-spacing="2" fill="#9fd9d1" textLength="450" lengthAdjust="spacingAndGlyphs">JAVA &#183; JAVASCRIPT &#183; PYTHON &#183; SQL</text>
    </g>
    <rect y="145" width="3" height="20" fill="#4fd1c5">
      <animate attributeName="x" dur="8s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.4375;0.625;0.8125;0.875;1" values="370;370;820;820;370;370"/>
      <animate attributeName="opacity" dur="0.8s" begin="1.2s" repeatCount="indefinite" values="1;1;0;0"/>
    </rect>
  </g>

  <line x1="450" y1="192" x2="750" y2="192" stroke="#4fd1c5" stroke-width="2" stroke-dasharray="300" stroke-dashoffset="300">
    <animate attributeName="stroke-dashoffset" from="300" to="0" dur="1s" begin="1.4s" fill="freeze"/>
  </line>
</svg>
